services:
  postgres-ic:
    image: postgres:17
    container_name: postgres-ic
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_ic_data:/var/lib/postgresql/data

volumes:
  postgres_ic_data: